name: Check, release and deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go and Task
        uses: ./.github/actions/setup-go-task

      - name: Lint
        run: task lint

  security:
    name: Security checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go and Task
        uses: ./.github/actions/setup-go-task

      - name: Security
        run: task security

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go and Task
        uses: ./.github/actions/setup-go-task

      - name: Run tests
        run: task test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  infra:
    name: Infra, functional and resilience tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go and Task
        uses: ./.github/actions/setup-go-task

      - name: Run infra tests
        run: task test-infra

      - name: Run functional tests
        run: task test-functional

      - name: Run resilience tests
        run: task test-resilience

  release:
    name: Semantic release
    needs:
      - lint
      - security
      - test
      - infra

    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    outputs:
      released: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run semantic-release
        id: semantic
        run: npx --yes semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to Raspberry v2
    needs: release

    if: >-
      github.ref == 'refs/heads/main' &&
      needs.release.outputs.released == 'true' &&
      vars.RASPBERRY_V2_DEPLOY_ENABLED == 'true'

    runs-on:
      - self-hosted
      - raspberry

    environment: raspberry-v2

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Set up Go 1.27.4
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'

      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install Ansible
        run: |
          python3 -m pip install --user ansible hvac
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r devops/ansible/requirements.yml

      - name: Build ARM64 binary
        run: task build

      - name: Deploy with Ansible
        run: |
          ansible-playbook -i devops/ansible/inventories/raspberry_v2/hosts devops/ansible/deploy.yml
