services:
  water_system:
    build:
      context: .
    container_name: water_system
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    environment:
      - SERVER_URL=${SERVER_URL:-:8080}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - ZONES_FILE=${ZONES_FILE:-/tmp/zones.yaml}
      - AUTH_TOKEN=${AUTH_TOKEN:-token}
      - DAILY_PROGRAMS_FILE=${DAILY_PROGRAMS_FILE:-/tmp/daily_programs.yml}
      - ODD_PROGRAMS_FILE=${ODD_PROGRAMS_FILE:-/tmp/odd_programs.yml}
      - EVEN_PROGRAMS_FILE=${EVEN_PROGRAMS_FILE:-/tmp/even_programs.yml}
      - WEEKLY_PROGRAMS_FILE=${WEEKLY_PROGRAMS_FILE:-/tmp/weekly_programs.yml}
      - TEMPERATURE_PROGRAMS_FILE=${TEMPERATURE_PROGRAMS_FILE:-/tmp/temperature_programs.yml}
      - EXECUTION_LOGS_FILE=${EXECUTION_LOGS_FILE:-/tmp/execution_logs.json}
      - STATUS_FILE=${STATUS_FILE:-/tmp/status.json}
      - PENDING_IRRIGATIONS_DIRECTORY=${PENDING_IRRIGATIONS_DIRECTORY:-/tmp/pending_irrigations}
      - NATS_SERVER_URL=${NATS_SERVER_URL:-nats://nats:4222}
      - EVENTS_DIRECTORY=${EVENTS_DIRECTORY:-/tmp/events}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318
      - OTEL_TRACES_SAMPLER=always_on
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - LOG_LEVEL=debug
      - NTFY_URL=http://ntfy:80
      - NTFY_TOPIC=bonsais
      - NTFY_USER=user
      - NTFY_PASSWORD=password
    ports:
      - "8083:8080"
    depends_on:
      - nats
      - lgtm
      - ntfy
    networks:
      - water_system
    command: ["air", "-c", ".air.toml"]

  nats:
    image: nats:2-alpine
    container_name: nats
    command: ["-js", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    restart: unless-stopped
    networks:
      - water_system

  nats-box:
    image: synadia/nats-box:latest
    container_name: nats-box
    depends_on:
      - nats
    stdin_open: true
    tty: true
    entrypoint: ["sh", "-lc", "sleep infinity"]
    networks:
      - water_system

  lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3001:3000"
      - "4317:4317"
      - "4318:4318"
    networks:
        - water_system

  ntfy:
      image: binwiederhier/ntfy:v2.22.0
      container_name: ntfy
      command:
        - serve
      ports:
        - "8085:80"
      volumes:
        - ./ntfy/cache:/var/cache/ntfy
      environment:
        NTFY_BASE_URL: http://localhost:8085
        NTFY_AUTH_DEFAULT_ACCESS: read-write
      networks:
          - water_system
networks:
  water_system:
    external: true

volumes:
  nats_data:
  go-mod-cache:
  go-build-cache: