[Service]
SERVER_URL="{{ server_url }}"
ENVIRONMENT="production"
ZONES_FILE="{{ home }}/zones.yaml"
AUTH_TOKEN="{{ auth_token }}"
DAILY_PROGRAMS_FILE="{{ home }}/daily_programs.yaml"
ODD_PROGRAMS_FILE="{{ home }}/odd_programs.yaml"
EVEN_PROGRAMS_FILE="{{ home }}/even_programs.yaml"
WEEKLY_PROGRAMS_FILE="{{ home }}/weekly_programs.yaml"
TEMPERATURE_PROGRAMS_FILE="{{ home }}/temperature_programs.yaml"
EXECUTION_LOGS_FILE="{{ home }}/execution_logs.json"
STATUS_FILE="{{ home }}/status.json"
PENDING_IRRIGATIONS_DIRECTORY="{{ home }}/pending_irrigations"
LOG_LEVEL="error"
NATS_SERVER_URL="{{ nats_server_url }}"
EVENTS_DIRECTORY="{{ home }}/events"
OTEL_EXPORTER_OTLP_ENDPOINT="{{ otel_endpoint }}"
OTEL_TRACES_SAMPLER="always_on"
OTEL_EXPORTER_OTLP_PROTOCOL="http/protobuf"
NTFY_URL="https://ntfy.bru-li.me"
NTFY_TOPIC="{{ ntfy_topic }}"
NTFY_USER="{{ ntfy_user }}"
NTFY_PASSWORD="{{ ntfy_password }}"
